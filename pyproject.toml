[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signoz-discord-jira"
version = "0.3.0"
description = "Encaminha alertas do SigNoz ao Discord, Jira e Twilio SMS."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
