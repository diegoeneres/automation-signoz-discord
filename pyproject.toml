[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signoz-discord-jira"
version = "0.4.0"
description = "Encaminha alertas do SigNoz ao Discord, Jira e SMS com fallback de provedor."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-instrumentation-httpx>=0.57b0,<1",
  "opentelemetry-instrumentation-sqlite3>=0.57b0,<1",
  "opentelemetry-instrumentation-system-metrics>=0.57b0,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
